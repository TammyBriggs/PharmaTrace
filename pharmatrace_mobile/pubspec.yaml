name: pharmatrace_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Typography: The Figma specimen specifies 'Inter'
  google_fonts: ^6.1.0
  # Skeleton loaders: Creates the animated loading effect
  shimmer: ^3.0.0
  # Lightweight universal camera implementation for reading QR codes
  mobile_scanner: ^5.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  http: ^1.6.0
  # Opens a transaction on the block explorer from the batch history
  url_launcher: ^6.3.1

  # cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Splash screen generator: Creates native splash screens for Android/iOS
  flutter_native_splash: ^2.3.6
  flutter_lints: ^5.0.0

# Configuration for the splash screen must be at the root level.
# Logo: the same shield mark as the web dashboard. After changing anything here run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  color_dark: "#111827"
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_logo_android12.png
    icon_background_color: "#FFFFFF"
    color_dark: "#111827"
    image_dark: assets/images/splash_logo_android12_dark.png
    icon_background_color_dark: "#111827"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
